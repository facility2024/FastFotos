<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastFotos - Modelos</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .modelos-page { padding: 32px 0; }
    .modelos-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .modelos-header h1 { font-size: 28px; font-weight: 700; }
    .modelos-header h1 em { font-style: normal; }
    .modelos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .modelo-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 3/4;
      background: var(--bg-card);
    }
    .modelo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .modelo-card:hover img { transform: scale(1.05); }
    .modelo-card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
    }
    .modelo-card-overlay h3 { font-size: 16px; font-weight: 600; }
    .modelo-card-overlay .username { font-size: 13px; color: var(--text-secondary); }
    .modelo-card-overlay .count { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-brand">FastFotos</a>
    <div class="nav-links">
      <a href="index.html">Video Feed Extractor</a>
      <a href="modelos.html" class="active">Modelos</a>
      <a href="fotos.html">Fotos Feed Extractor</a>
    </div>
  </nav>

  <div class="container">
    <div class="modelos-page">
      <div class="modelos-header">
        <h1><em>&#128247;</em> Modelos</h1>
        <span id="modelos-count" style="color:var(--text-secondary)">0</span>
      </div>
      <div id="modelos-grid" class="modelos-grid"></div>
    </div>
  </div>

  <!-- Model Modal -->
  <div id="model-modal" class="model-modal"></div>

  <!-- Feed View -->
  <div id="feed-view" class="feed-view"></div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const grid = document.getElementById("modelos-grid");
      const countEl = document.getElementById("modelos-count");
      try {
        grid.innerHTML = Array(10).fill("").map(() => '<div class="skeleton skeleton-card"></div>').join("");
        const models = await API.fetchModels();
        const videos = await API.fetchFeedVideos();
        const modelMap = {};
        for (const v of videos) {
          if (!modelMap[v.model_slug]) {
            modelMap[v.model_slug] = { slug: v.model_slug, name: v.model_name, posts: 0 };
          }
          modelMap[v.model_slug].posts++;
        }
        const enriched = models.map(m => ({
          ...m,
          slug: m.slug || m.username,
          postCount: modelMap[m.slug || m.username]?.posts || 0,
        })).filter(m => m.postCount > 0).sort((a, b) => b.postCount - a.postCount);

        countEl.textContent = enriched.length;
        grid.innerHTML = enriched.map(m => `
          <div class="modelo-card" onclick="App.openModelModal('${m.slug}')">
            <img src="${m.profile_pic_url || API.getModelAvatar(m.slug)}" 
                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 220 300%22><rect fill=%22%23222%22 width=%22220%22 height=%22300%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2224%22>${(m.full_name||m.username)[0]}</text></svg>'" loading="lazy" alt="">
            <div class="modelo-card-overlay">
              <h3>${m.full_name || m.username}</h3>
              <div class="username">@${m.username}</div>
              <div class="count">${m.postCount} videos</div>
            </div>
          </div>
        `).join("");
      } catch (err) {
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--text-secondary)">Erro: ${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
